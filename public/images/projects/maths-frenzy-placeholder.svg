    <line x1="0" y1="0" x2="0" y2="-15" stroke="#f4b93e" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="6" stroke="#f4b93e" stroke-width="4" stroke-linecap="round"/>
    <rect x="-5" y="-36" width="10" height="6" rx="2" fill="#f4b93e"/>
  </g>
  <text x="320" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#ffffff">MATHS FRENZY</text>
  <text x="320" y="228" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.6">20 questions. 20 seconds each.</text>
  <rect x="254" y="262" width="132" height="28" rx="14" fill="#f4b93e"/>
  <text x="320" y="281" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0f0d1d">Project Preview</text>
