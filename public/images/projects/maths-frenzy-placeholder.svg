<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Maths Frenzy project preview placeholder</title>
  <desc id="d">Arithmetic symbols and a countdown timer with the text Maths Frenzy.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1730"/><stop offset="1" stop-color="#0f0d1d"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" fill="#ffffff" fill-opacity="0.09" font-size="84">
    <text x="40" y="110">+</text><text x="150" y="70">&#8722;</text><text x="470" y="100">&#215;</text><text x="560" y="190">&#247;</text>
    <text x="52" y="320">7</text><text x="540" y="320">9</text>
  </g>
  <g transform="translate(320 78)">
